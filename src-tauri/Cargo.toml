[package]
name = "app"
version = "0.1.0"
description = "A desktop application to build and test deterministic and non-deterministic finite automata"
authors = ["Matthew Farah"]
license = "MIT"
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.65"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Named apart from the app binary, since a library and binary with the same name collide on Windows
[lib]
name = "app_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
diesel = { version = "2.2.3", features = ["sqlite", "chrono"] }
rusqlite = { version = "0.30.0", features = ["bundled"] }
chrono = { version = "0.4.38", features = ["serde", "clock"] }
diesel-derive-enum = { version = "2.1.0", features = ["sqlite"] }
diesel_migrations = "2.2.0"
envy = "0.4.2"


[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
