name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The end-to-end test needs a KWin session, so it runs locally (see e2e/README.md) rather than here
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Backend tests
        working-directory: src-tauri
        run: cargo test
